name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Frontmatter, tags, images, placeholders (queued posts are held to a stricter standard)
      - run: npm run lint:content
      # Fails on broken internal links (onBrokenLinks: 'throw') and bad MDX
      - run: npm run build
      # Production builds skip draft posts, so build the queued ones as if released
      - run: npm run check:drafts
